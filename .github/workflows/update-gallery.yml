name: Auto-Update Gallery on New Media

on:
  push:
    branches:
      - main
    paths:
      - 'assets/gallery/photos/**'
      - 'assets/gallery/videos/**'

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and overwrite gallery.html
        run: |
          cat > gallery.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Gallery - Endless Skys Drone Services</title>
            <link rel="stylesheet" href="style.css"/>
            <style>
              .gallery {
                padding: 6rem 5%;
                max-width: 1400px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 1.5rem;
              }
              .gallery-item {
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 20px rgba(0,0,0,0.2);
                background: #111;
                aspect-ratio: 16 / 9;
                position: relative;
                transition: transform 0.3s ease;
              }
              .gallery-item:hover {
                transform: scale(1.03);
              }
              .gallery-item img, .gallery-item video {
                width: 100%;
                height: 100%;
                object-fit: cover;
              }
              .gallery-item .overlay-title {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(0,0,0,0.65);
                color: white;
                padding: 0.8rem;
                text-align: center;
                font-size: 1rem;
                opacity: 0;
                transition: opacity 0.3s;
              }
              .gallery-item:hover .overlay-title {
                opacity: 1;
              }
            </style>
          </head>
          <body>

            <header>
              <nav>
                <div class="logo">Endless Skys</div>
                <ul class="nav-links">
                  <li><a href="index.html">Home</a></li>
                  <li><a href="about.html">About</a></li>
                  <li><a href="services.html">Services</a></li>
                  <li><a href="gallery.html">Gallery</a></li>
                  <li><a href="contact.html">Contact</a></li>
                </ul>
              </nav>
            </header>

            <section class="hero">
              <div class="hero-content">
                <h1>Gallery</h1>
                <p>Real footage & photos from our drone missions.</p>
              </div>
            </section>

            <section class="gallery">
          EOF

          # Add photos
          for file in assets/gallery/photos/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "  <div class='gallery-item'>" >> gallery.html
              echo "    <img src='$file' alt='$filename' loading='lazy'>" >> gallery.html
              echo "    <div class='overlay-title'>$filename</div>" >> gallery.html
              echo "  </div>" >> gallery.html
            fi
          done

          # Add self-hosted videos (MP4 only)
          for file in assets/gallery/videos/*.mp4; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "  <div class='gallery-item'>" >> gallery.html
              echo "    <video controls preload='metadata' loading='lazy'>" >> gallery.html
              echo "      <source src='$file' type='video/mp4'>" >> gallery.html
              echo "      Your browser does not support the video tag." >> gallery.html
              echo "    </video>" >> gallery.html
              echo "    <div class='overlay-title'>$filename</div>" >> gallery.html
              echo "  </div>" >> gallery.html
            fi
          done

          cat >> gallery.html << 'EOF'
            </section>

            <footer>
              <p>&copy; 2026 Endless Skys. All rights reserved. | FAA Part 107 Certified | Insured</p>
            </footer>

          </body>
          </html>
          EOF

      - name: Commit updated gallery.html
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add gallery.html
          git commit -m "Auto-update gallery.html with new photos/videos" || echo "No changes to commit"
          git push
